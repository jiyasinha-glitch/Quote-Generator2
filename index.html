<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="quote-container">
  <p id="quote">Click the button to generate a quote!</p>
  <p id="author"></p>
  <button id="btn">Get Quote</button>
</div>
<script>
const quotel = document.getElementById('quote');
const authorl = document.getElementById('author');
const button = document.getElementById('btn');

async function fetchQuote() {
  try {
    const response = await fetch('https://dummyjson.com/quotes/random');
    const data = await response.json();

    quotel.innerText = `"${data.quote}"`;
    authorl.innerText = `- ${data.author}`;
  } catch (error) {
    quotel.innerText = 'Failed to fetch quote. Try again!';
    console.error('Error:', error);
  }
}

button.addEventListener('click', fetchQuote);
</script>
</body>
</html>
